schema_version: "1.1"
corpus_id: level_03_generated_1k_500_random_v2_candidate
level_id: level_03
environment: local
seeds: [42]
repeats: 3
default_config: config/level_03/experiments/inventory_items_1000_fleet_500.yaml
matrix:
  case_prefix: random
  benchmark_stratum: random_distribution
  group: level_03_distribution_v2_candidate
  dataset_family: generated_1k_500_cross_level
  expected_outcome: feasible
  algorithms: [extreme_point_best_fit, extreme_point_ffd, maximal_space_best_fit]
  scales:
    - {item_count: 20, time_limit_seconds: 30, scale_bucket: small}
    - {item_count: 50, time_limit_seconds: 30, scale_bucket: small}
    - {item_count: 100, time_limit_seconds: 60, scale_bucket: medium}
    - {item_count: 200, time_limit_seconds: 120, scale_bucket: large}
    - {item_count: 300, time_limit_seconds: 120, scale_bucket: xlarge}
    - {item_count: 500, time_limit_seconds: 180, scale_bucket: scale}
  selections:
    - {selection_id: random, item_selection: stable_random, difficulty: representative_random, selection_seeds: [101, 211, 307, 401, 503, 601, 701, 809, 907, 1009]}
  container_limits: {maximum_multiplier: 2.0, maximum_extra: 4, maximum_cap: 30}
  config_overrides:
    container_search:
      enabled: true
      automatically_increase_container_count: true
      validation_reserve_seconds: 3
      secondary_search_score: {enabled: false}
      consolidation: {enabled: false, container_elimination: {enabled: false}}
