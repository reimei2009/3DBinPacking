schema_version: "1.0"
corpus_id: level_03_repair_ab_100_500_v1
level_id: level_03
environment: local
seeds: [42]
repeats: 2
default_config: config/level_03/experiments/inventory_items_1000_fleet_500.yaml

# Mỗi comparison_group chỉ khác treatment consolidation. Item IDs, catalog,
# orientation, exact support, start/max, deadline và seed được giữ nguyên.
cases:
  - &off_prefix_100
    case_id: repair_off_prefix_i100
    comparison_group: repair_prefix_i100
    variant_id: repair_disabled
    group: repair_ab
    difficulty: normal
    item_count: 100
    container_count: 3
    expected_outcome: feasible
    algorithms: &constructors [extreme_point_best_fit, extreme_point_ffd, maximal_space_best_fit]
    item_selection: prefix
    dataset_family: generated_1k_500_horizontal_orientation
    scale_bucket: medium
    config_overrides:
      container_search: &search_100
        enabled: true
        initial_used_container_count: 3
        max_used_container_count: 7
        automatically_increase_container_count: true
        time_limit_seconds: 60
        validation_reserve_seconds: 3
        consolidation: {enabled: false, container_elimination: {enabled: false}}
  - <<: *off_prefix_100
    case_id: repair_on_prefix_i100
    variant_id: repair_enabled
    config_overrides:
      container_search:
        <<: *search_100
        consolidation: {enabled: true, time_limit_seconds: 20, container_elimination: {enabled: true}}

  - &off_random_100
    <<: *off_prefix_100
    case_id: repair_off_random101_i100
    comparison_group: repair_random101_i100
    item_selection: stable_random
    selection_seed: 101
  - <<: *off_random_100
    case_id: repair_on_random101_i100
    variant_id: repair_enabled
    config_overrides:
      container_search:
        <<: *search_100
        consolidation: {enabled: true, time_limit_seconds: 20, container_elimination: {enabled: true}}

  - &off_prefix_300
    case_id: repair_off_prefix_i300
    comparison_group: repair_prefix_i300
    variant_id: repair_disabled
    group: repair_ab
    difficulty: normal
    item_count: 300
    container_count: 9
    expected_outcome: feasible
    algorithms: *constructors
    item_selection: prefix
    dataset_family: generated_1k_500_horizontal_orientation
    scale_bucket: xlarge
    config_overrides:
      container_search: &search_300
        enabled: true
        initial_used_container_count: 9
        max_used_container_count: 18
        automatically_increase_container_count: true
        time_limit_seconds: 120
        validation_reserve_seconds: 3
        consolidation: {enabled: false, container_elimination: {enabled: false}}
  - <<: *off_prefix_300
    case_id: repair_on_prefix_i300
    variant_id: repair_enabled
    config_overrides:
      container_search:
        <<: *search_300
        consolidation: {enabled: true, time_limit_seconds: 45, container_elimination: {enabled: true}}

  - &off_random_300
    <<: *off_prefix_300
    case_id: repair_off_random101_i300
    comparison_group: repair_random101_i300
    item_selection: stable_random
    selection_seed: 101
  - <<: *off_random_300
    case_id: repair_on_random101_i300
    variant_id: repair_enabled
    config_overrides:
      container_search:
        <<: *search_300
        consolidation: {enabled: true, time_limit_seconds: 45, container_elimination: {enabled: true}}

  - &off_prefix_500
    case_id: repair_off_prefix_i500
    comparison_group: repair_prefix_i500
    variant_id: repair_disabled
    group: repair_ab
    difficulty: scale
    item_count: 500
    container_count: 14
    expected_outcome: feasible
    algorithms: *constructors
    item_selection: prefix
    dataset_family: generated_1k_500_horizontal_orientation
    scale_bucket: scale
    config_overrides:
      container_search: &search_500
        enabled: true
        initial_used_container_count: 14
        max_used_container_count: 28
        automatically_increase_container_count: true
        time_limit_seconds: 180
        validation_reserve_seconds: 3
        consolidation: {enabled: false, container_elimination: {enabled: false}}
  - <<: *off_prefix_500
    case_id: repair_on_prefix_i500
    variant_id: repair_enabled
    config_overrides:
      container_search:
        <<: *search_500
        consolidation: {enabled: true, time_limit_seconds: 60, container_elimination: {enabled: true}}

  - &off_random_500
    <<: *off_prefix_500
    case_id: repair_off_random101_i500
    comparison_group: repair_random101_i500
    item_selection: stable_random
    selection_seed: 101
  - <<: *off_random_500
    case_id: repair_on_random101_i500
    variant_id: repair_enabled
    config_overrides:
      container_search:
        <<: *search_500
        consolidation: {enabled: true, time_limit_seconds: 60, container_elimination: {enabled: true}}
