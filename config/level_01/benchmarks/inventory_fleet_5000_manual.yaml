  containers grouped into 25 deterministic types. Run only after generating fleet_5000_t25.
config: config/level_01/experiments/extreme_point_best_fit_inventory_fleet_5000.yaml
environment: local
algorithms: [extreme_point_best_fit, extreme_point_ffd]
seeds: [42]
repeats: 2
scenarios:
