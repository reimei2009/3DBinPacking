suite_id: level_01_inventory_fleet_500_gate_v1
level_id: level_01
description: >
  Gate B manual protocol for Level 1 inventory-aware search over 500 physical
  containers grouped into 10 types. Run only after generating fleet_500_t10.
config: config/level_01/experiments/extreme_point_best_fit_inventory_fleet_500.yaml
environment: local
algorithms: [extreme_point_best_fit, extreme_point_ffd]
seeds: [42]
repeats: 2
scenarios:
  - scenario_id: inventory_smoke_i20_f500
    description: "Twenty generated items against the full 500-container inventory."
    item_count: 20
    container_count: 1
    item_selection: prefix
    tags: [inventory_gate, fleet_500, smoke]
  - scenario_id: inventory_practical_i50_f500
    description: "Fifty generated items against the full 500-container inventory."
    item_count: 50
    container_count: 1
    item_selection: prefix
    tags: [inventory_gate, fleet_500, practical]
