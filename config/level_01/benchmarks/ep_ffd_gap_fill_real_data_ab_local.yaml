suite_id: level_01_ep_ffd_gap_fill_real_data_ab_v1
level_id: level_01
description: >
  Controlled real-data A/B gate for canonical EP-FFD and the bounded Gap Fill
  comparator on the same public item source and fixed C1-C5 catalog.
config: config/level_01/experiments/ep_ffd_gap_fill_real_data_ab_local.yaml
environment: local
algorithms:
  - extreme_point_ffd
  - extreme_point_ffd_gap_fill
seeds: [42]
repeats: 2
scenarios:
  - scenario_id: prefix_i20_c5
    item_count: 20
    container_count: 5
    item_selection: prefix
    tags: [real_data, controlled_ab, fixed_subset]
  - scenario_id: stable_random_101_i20_c5
    item_count: 20
    container_count: 5
    item_selection: stable_random
    selection_seed: 101
    tags: [real_data, controlled_ab, fixed_subset, seeded_subset]
  - scenario_id: stable_random_202_i20_c5
    item_count: 20
    container_count: 5
    item_selection: stable_random
    selection_seed: 202
    tags: [real_data, controlled_ab, fixed_subset, seeded_subset]
  - scenario_id: volume_stratified_i20_c5
    item_count: 20
    container_count: 5
    item_selection: volume_stratified
    tags: [real_data, controlled_ab, fixed_subset, volume_diverse]
  - scenario_id: largest_volume_i20_c5
    item_count: 20
    container_count: 5
    item_selection: largest_volume
    tags: [real_data, controlled_ab, fixed_subset, volume_heavy]
