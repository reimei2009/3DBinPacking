algorithms:
  maximal_space_best_fit:
    subset_enumeration_limit: 12
  extreme_point_best_fit:
    subset_enumeration_limit: 12
  extreme_point_ffd:
    subset_enumeration_limit: 12
  extreme_point_ffd_gap_fill:
    fixed_subset: true
    subset_enumeration_limit: 1
    gap_fill:
      lookahead_window_size: 5
      max_constrained_points_per_step: 8
      max_candidates_per_step: 64
      maximum_reorder_distance: 4
    gap_fill_time_limit_seconds: 30
    gap_fill_validation_reserve_seconds: 2
  extreme_point_hill_climbing:
    subset_enumeration_limit: 12
    subset_candidate_limit: 48
    max_iterations: 10
    max_neighbors: 24
  extreme_point_simulated_annealing:
    subset_enumeration_limit: 12
    subset_candidate_limit: 48
    max_iterations: 200
    max_neighbors: 48
    neighbors_per_iteration: 3
    initial_temperature: 0.25
    cooling_rate: 0.97
    minimum_temperature: 0.0001
