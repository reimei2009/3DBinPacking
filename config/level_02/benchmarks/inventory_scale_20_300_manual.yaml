suite_id: level_02_inventory_scale_20_300_v1
level_id: level_02
description: >
  Nghiệm thu thủ công inventory-aware Level 2 trên cùng nguồn 1.000 kiện và
  catalog 500 container. Mọi nghiệm chính thức phải qua independent exact-support
  validation; hai repeat dùng để kiểm tra deterministic signature.
config: config/level_02/experiments/inventory_items_1000_fleet_500_scale_acceptance.yaml
environment: local
algorithms: [extreme_point_best_fit, extreme_point_ffd]
seeds: [42]
repeats: 2
scenarios:
  - scenario_id: inventory_exact_support_i20_f500
    description: "Gate smoke 20 kiện trên toàn bộ catalog 500 container."
    item_count: 20
    container_count: 1
    item_selection: prefix
    tags: [acceptance, inventory, exact_support, smoke]
  - scenario_id: inventory_exact_support_i100_f500
    description: "Gate practical 100 kiện trên toàn bộ catalog 500 container."
    item_count: 100
    container_count: 1
    item_selection: prefix
    tags: [acceptance, inventory, exact_support, practical]
  - scenario_id: inventory_exact_support_i300_f500
    description: "Gate scale 300 kiện trên toàn bộ catalog 500 container."
    item_count: 300
    container_count: 1
    item_selection: prefix
    tags: [acceptance, inventory, exact_support, scale, manual]
