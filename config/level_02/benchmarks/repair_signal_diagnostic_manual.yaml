schema_version: "1.0"
corpus_id: level_02_company_like_repair_signal_diagnostic_v1
level_id: level_02
environment: local
seeds: [42]
repeats: 3
default_config: config/level_02/experiments/company_like_shadow_v1.yaml

# Diagnostic only: full repair budget, no early-stop and no canonical ranking use.
cases:
  - &random_300
    case_id: repair_signal_random101_i300
    group: repair_signal_diagnostic
    difficulty: early_improvement_control
    item_count: 300
    container_count: 9
    expected_outcome: feasible
    algorithms: &constructors [extreme_point_best_fit, extreme_point_ffd]
    item_selection: stable_random
    selection_seed: 101
    dataset_family: company_like_shadow_1k_500_v1
    scale_bucket: large
    config_overrides:
      container_search:
        enabled: true
        initial_used_container_count: 9
        max_used_container_count: 18
        automatically_increase_container_count: true
        time_limit_seconds: 120
        validation_reserve_seconds: 3
        consolidation:
          enabled: true
          signal_telemetry_enabled: true
          time_limit_seconds: 45
          container_elimination: {enabled: true}
          early_stop: {enabled: false, minimum_runtime_seconds: 10, maximum_no_improvement_candidates: 24}

  - &prefix_500
    case_id: repair_signal_prefix_i500
    group: repair_signal_diagnostic
    difficulty: no_improvement_control
    item_count: 500
    container_count: 14
    expected_outcome: feasible
    algorithms: *constructors
    item_selection: prefix
    dataset_family: company_like_shadow_1k_500_v1
    scale_bucket: scale
    config_overrides:
      container_search: &search_500
        enabled: true
        initial_used_container_count: 14
        max_used_container_count: 28
        automatically_increase_container_count: true
        time_limit_seconds: 180
        validation_reserve_seconds: 3
        consolidation:
          enabled: true
          signal_telemetry_enabled: true
          time_limit_seconds: 60
          container_elimination: {enabled: true}
          early_stop: {enabled: false, minimum_runtime_seconds: 15, maximum_no_improvement_candidates: 32}

  - <<: *prefix_500
    case_id: repair_signal_random101_i500
    difficulty: late_improvement_regression
    item_selection: stable_random
    selection_seed: 101
