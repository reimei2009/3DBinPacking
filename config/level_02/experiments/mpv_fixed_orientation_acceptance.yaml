extends: ../default.yaml
project:
  algorithm_id: extreme_point_best_fit
instance:
  item_count: 100
  container_count: 1
paths:
  raw_items_csv: data/interim/mpv_3dbpp/acceptance_primary/solver_items.csv
  raw_containers_csv: data/interim/mpv_3dbpp/acceptance_primary/solver_containers.csv
  items_source_mapping: config/common/data_sources/mpv_fixed_orientation.yaml
  processed_dir: data/processed/level_02/mpv_fixed_orientation_acceptance
  manifest_json: data/processed/level_02/mpv_fixed_orientation_acceptance/latest_manifest.json
academic_corpus:
  source_import_manifest_path: data/external/mpv_3dbpp/imported/mpv-official-source-v1/import_manifest.json
  normalization_manifest_path: data/interim/mpv_3dbpp/acceptance_primary/generation_manifest.json
  semantics: fixed_orientation_with_level_02_exact_support
  best_known_comparison_allowed: false
container_search:
  enabled: true
  initial_used_container_count: 1
  max_used_container_count: 100
  automatically_increase_container_count: true
  time_limit_seconds: 60
  validation_reserve_seconds: 2
  consolidation:
    enabled: true
    time_limit_seconds: 10
    max_candidates: 128
