extends: ../default.yaml
project:
  algorithm_id: extreme_point_best_fit
instance:
  item_count: 100
  container_count: 1
paths:
  raw_items_csv: data/interim/synthetic/level_01_inventory_fleet_5000_t25_v1/solver_items.csv
  raw_containers_csv: data/interim/synthetic/level_01_inventory_fleet_5000_t25_v1/solver_containers.csv
  items_source_mapping: config/common/data_sources/empirical_template_level_08.yaml
  processed_dir: data/processed/level_02/inventory_fleet_5000
  manifest_json: data/processed/level_02/inventory_fleet_5000/latest_manifest.json
container_search:
  enabled: true
  initial_used_container_count: 1
  max_used_container_count: 12
  automatically_increase_container_count: true
  exhaustive_max_containers: 10
  max_candidates_per_count: 96
  neighborhood_width: 24
  soft_volume_buffer_ratio: 0.10
  time_limit_seconds: 60
dataset_policy:
  generation_manifest: data/interim/synthetic/level_01_inventory_fleet_5000_t25_v1/generation_manifest.json
  expected_usage_class: solver_research
