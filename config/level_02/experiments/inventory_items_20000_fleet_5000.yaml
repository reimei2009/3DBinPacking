extends: inventory_fleet_5000.yaml
instance:
  item_count: 1000
  container_count: 1
paths:
  raw_items_csv: data/interim/synthetic/level_02_solver_research_i20000_f5000_v1/solver_items.csv
  raw_containers_csv: data/interim/synthetic/level_02_solver_research_i20000_f5000_v1/solver_containers.csv
  items_source_mapping: config/common/data_sources/empirical_template_level_08.yaml
  processed_dir: data/processed/level_02/inventory_items_20000_fleet_5000
  manifest_json: data/processed/level_02/inventory_items_20000_fleet_5000/latest_manifest.json
dataset_policy:
  generation_manifest: data/interim/synthetic/level_02_solver_research_i20000_f5000_v1/generation_manifest.json
  expected_usage_class: solver_research
container_search:
  enabled: true
  initial_used_container_count: 1
  max_used_container_count: 5000
  automatically_increase_container_count: true
  time_limit_seconds: 180
  validation_reserve_seconds: 2
  consolidation:
    enabled: false
