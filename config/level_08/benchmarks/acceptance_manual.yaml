# Manual only: create scale_300_c25 data first. Do not run in pytest.
suite_id: level_08_delivery_acceptance_manual_v1
level_id: level_08
description: >
  Compare config-driven delivery-aware Best Fit and FFD with identical declared
  priority/stop metadata. Successful runs require independent Level 1–8 validation.
config: config/level_08/experiments/synthetic_delivery_300_local.yaml
environment: local
algorithms:
  - extreme_point_best_fit_delivery
  - extreme_point_ffd_delivery
seeds: [42]
repeats: 1
