extends: ../level_07/experiments/balance_aware_best_fit_fixture.yaml
project:
  level_id: level_08
  algorithm_id: level_08_fixture_validation_bundle
  random_seed: 42
instance:
  item_count: 2
  container_count: 1
  item_selection_strategy: prefix
  item_selection_seed: null
paths:
  raw_items_csv: data/raw/level_08/lifo_valid_runtime_fixture_items.csv
  items_source_mapping: config/common/data_sources/level_08_runtime_fixture.yaml
  processed_dir: data/processed/level_08/lifo_valid_runtime_fixture
  manifest_json: data/processed/level_08/lifo_valid_runtime_fixture/latest_manifest.json
  output_root: outputs
containers:
  - {container_id: C1, length_mm: 200, width_mm: 80, height_mm: 60, max_weight_kg: 100, cost: 100, availability: 1}
fixture:
  fixture_id: level_08_lifo_valid_runtime_fixture_v1
  layout_file: config/level_08/fixtures/lifo_valid_runtime_layout.yaml
  required_item_count: 2
  required_container_count: 1
  required_environment: local
  required_item_selection_strategy: prefix
  required_item_selection_seed: null
unloading:
  rules_file: config/level_08/unloading_rules.yaml
runtime_candidate:
  status: cli_only_validation_fixture
  algorithm_id: level_08_fixture_validation_bundle
  output:
    run_path: outputs/level_08/runs/<run_id>
    required_solution_tables:
      - unloading_accessibility.csv
      - rehandle_plan.csv
    required_validation_documents:
      - unloading_validation.json
