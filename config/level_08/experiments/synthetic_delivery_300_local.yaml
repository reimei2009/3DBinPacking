extends: ../default.yaml
project:
  algorithm_id: extreme_point_best_fit_delivery
instance:
  item_count: 300
  container_count: 25
  item_selection_strategy: prefix
  item_selection_seed: null
paths:
  raw_items_csv: data/raw/level_08/generated/level_08_scale_300_c25_items.csv
  raw_containers_csv: data/raw/level_08/generated/level_08_scale_300_c25_containers.csv
  items_source_mapping: config/common/data_sources/level_08_synthetic_delivery.yaml
  processed_dir: data/processed/level_08/synthetic_delivery_300
  manifest_json: data/processed/level_08/synthetic_delivery_300/latest_manifest.json
delivery_construction_mode: delivery_priority_primary
delivery_construction_compare_max_items: 100
algorithms:
  extreme_point_best_fit_delivery:
    subset_enumeration_limit: 12
  extreme_point_ffd_delivery:
    subset_enumeration_limit: 12
# At this scale the pipeline deadline, not the old 256-candidate fixture cap,
# governs local delivery repair.
delivery_repair_max_candidates: 8192
delivery_repair_contributor_limit: 16
delivery_repair_relocation_transfer_max_candidates: 4096
delivery_repair_swap_max_candidates: 2048
delivery_repair_neighborhood_max_candidates: 2048
delivery_repair_neighborhood_sizes: [4, 8, 12]
delivery_repair_operator_time_fractions: [0.5, 0.25, 0.25]
delivery_repair_extra_max_candidates: 2048
