extends: ../default.yaml
project:
  algorithm_id: extreme_point_best_fit_delivery
instance:
  item_count: 100
  container_count: 10
  item_selection_strategy: prefix
  item_selection_seed: null
paths:
  raw_items_csv: data/raw/level_08/generated/level_08_scale_100_c10_items.csv
  raw_containers_csv: data/raw/level_08/generated/level_08_scale_100_c10_containers.csv
  items_source_mapping: config/common/data_sources/level_08_synthetic_delivery.yaml
  processed_dir: data/processed/level_08/synthetic_delivery_100_sequential
  manifest_json: data/processed/level_08/synthetic_delivery_100_sequential/latest_manifest.json
sequential_simulation:
  enabled: true
  required_when_enabled: true
  rules_file: config/level_08/sequential_simulation_rules.yaml
  time_limit_seconds: 45
delivery_construction_mode: delivery_priority_primary
sequential_balance_construction_enabled: true
